name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [rc/dv, rc/qa, rc/np, main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  branch-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name and merge direction
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          slug='([A-Z]+[0-9]+-)?[a-z0-9]+(-[a-z0-9]+)*'
          work="^(feat|fix|docs|chore|refactor|perf|ci|test|build)/${slug}$"

          refuse() { echo "::error::$1"; exit 1; }

          if [[ $BASE_REF == 'rc/dv' ]]; then
            if [[ $HEAD_REF =~ $work || $HEAD_REF == dependabot/* ]]; then
              echo "work branch -> rc/dv"; exit 0
            fi
            refuse "only feat/*, fix/*, docs/*, chore/*, refactor/*, perf/*, ci/*, test/* or build/* branches (or dependabot/*) may merge into rc/dv"
          elif [[ $BASE_REF == 'rc/qa' ]]; then
            [[ $HEAD_REF == 'rc/dv' ]] && { echo "promotion rc/dv -> rc/qa"; exit 0; }
            refuse "only rc/dv may merge into rc/qa"
          elif [[ $BASE_REF == 'rc/np' ]]; then
            [[ $HEAD_REF == 'rc/qa' ]] && { echo "promotion rc/qa -> rc/np"; exit 0; }
            refuse "only rc/qa may merge into rc/np"
          elif [[ $BASE_REF == 'main' ]]; then
            [[ $HEAD_REF == 'rc/np' ]] && { echo "promotion rc/np -> main (release)"; exit 0; }
            [[ $HEAD_REF =~ ^hotfix/${slug}$ ]] && { echo "hotfix -> main"; exit 0; }
            refuse "only rc/np or hotfix/* may merge into main"
          else
            refuse "PRs may only target rc/dv, rc/qa, rc/np or main"
          fi

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ $HEAD_REF =~ ^(rc|hotfix)/ ]]; then
            echo "Promotion/back-merge: title not checked"; exit 0
          fi
          re='^(feat|fix|perf|refactor|chore|ci|docs|test|build)(\([a-z0-9-]+\))?!?: .+'
          if [[ ! $TITLE =~ $re ]]; then
            echo "::error::PR title must look like 'feat(scope): summary', got: $TITLE"
            exit 1
          fi

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q
