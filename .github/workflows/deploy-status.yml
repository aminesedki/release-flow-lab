name: Deploy status

# Reports each Cloud Build deploy on the commit: status, duration and a link
# to the full console logs (visible in the Checks tab of the commit / PR).

on:
  push:
    branches: [rc/dv, rc/qa, rc/np, main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  statuses: write
  id-token: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Map ref to environment
        id: env
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          case "$REF_TYPE/$REF_NAME" in
            branch/rc/dv) env=dv; project=aminesedki-rf-dv ;;
            branch/rc/qa) env=qa; project=aminesedki-rf-qa ;;
            branch/rc/np) env=np; project=aminesedki-rf-np ;;
            branch/main)  env=pd; project=aminesedki-rf-pd ;;
            tag/*)        env=pd; project=aminesedki-rf-pd ;;
            *) echo "::error::unexpected ref $REF_TYPE/$REF_NAME"; exit 1 ;;
          esac
          echo "env=$env" >> "$GITHUB_OUTPUT"
          echo "project=$project" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars[format('WIF_PROVIDER_{0}', steps.env.outputs.env)] }}
          service_account: ${{ vars[format('DEPLOY_SA_{0}', steps.env.outputs.env)] }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Wait for Cloud Build and collect report
        id: build
        env:
          PROJECT: ${{ steps.env.outputs.project }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x scripts/cb-wait.sh
          report=$(scripts/cb-wait.sh "$PROJECT" "europe-west9" "$SHA" 1500)
          STATUS=$(echo "$report" | sed -n 's/^STATUS=//p')
          DURATION=$(echo "$report" | sed -n 's/^DURATION=//p')
          LOG_URL=$(echo "$report" | sed -n 's/^LOG_URL=//p')
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "log_url=$LOG_URL" >> "$GITHUB_OUTPUT"

      - name: Post commit status
        env:
          ENV_NAME: ${{ steps.env.outputs.env }}
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          STATUS: ${{ steps.build.outputs.status }}
          DURATION: ${{ steps.build.outputs.duration }}
          LOG_URL: ${{ steps.build.outputs.log_url }}
        run: |
          set -euo pipefail
          case $STATUS in
            SUCCESS) state=success ;;
            *) state=failure ;;
          esac
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/$SHA" \
            -f state=$state \
            -f context="deploy/$ENV_NAME" \
            -f "description=Cloud Build: $STATUS in $DURATION" \
            -f "target_url=$LOG_URL"
          echo "Posted deploy/$ENV_NAME on $SHA: $STATE_LABEL=$STATUS in $DURATION -> $LOG_URL" \
            | sed "s/\$STATE_LABEL/$state/"
