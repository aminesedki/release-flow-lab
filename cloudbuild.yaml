# Cloud Build pipeline: build the FastAPI image and deploy it to one environment.
# The trigger provides _ENV, _SERVICE, _REGION, _REPO, _RUNTIME_SA, _LOGS_BUCKET
# (see infra/devops/main.tf). Bash logic lives in scripts/cb-*.sh so this YAML
# stays free of shell variables Cloud Build would try to substitute.
#
# Version resolution:
#   - push on a release branch -> 0.0.0-dev.<short-sha>
#   - push of a tag vMAJOR.MINOR.PATCH -> MAJOR.MINOR.PATCH
#
# GitHub reporting: a commit status "deploy/<env>" is set pending at start and
# success/failure (with duration + console link) at the end. The docker and
# deploy steps use allow_failure so the finalize step can still report failures.

logsBucket: '${_LOGS_BUCKET}'

options:
  substitution_option: ALLOW_LOOSE
  logging: GCS_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_NUMBER}/secrets/github-token/versions/latest
      env: 'GITHUB_TOKEN'

steps:
  - name: ubuntu:22.04
    entrypoint: bash
    env:
      - '_ENV=${_ENV}'
      - '_REGION=${_REGION}'
      - 'COMMIT_SHA=${COMMIT_SHA}'
    args:
      - -c
      - 'python3 scripts/github_status.py start'

  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    allowFailure: true
    env:
      - '_ENV=${_ENV}'
      - '_SERVICE=${_SERVICE}'
      - '_REGION=${_REGION}'
      - '_REPO=${_REPO}'
      - 'PROJECT_ID=${PROJECT_ID}'
      - 'SHORT_SHA=${SHORT_SHA}'
      - 'TAG_NAME=${TAG_NAME}'
    args:
      - scripts/cb-build.sh

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    allowFailure: true
    env:
      - '_ENV=${_ENV}'
      - '_SERVICE=${_SERVICE}'
      - '_REGION=${_REGION}'
      - '_REPO=${_REPO}'
      - '_RUNTIME_SA=${_RUNTIME_SA}'
      - 'PROJECT_ID=${PROJECT_ID}'
    args:
      - scripts/cb-deploy.sh

  - name: ubuntu:22.04
    entrypoint: bash
    secretEnv: ['GITHUB_TOKEN']
    env:
      - '_ENV=${_ENV}'
      - '_REGION=${_REGION}'
      - 'COMMIT_SHA=${COMMIT_SHA}'
    args:
      - -c
      - 'python3 scripts/github_status.py finish'
