# Cloud Build pipeline: build the FastAPI image and deploy it to one environment.
# The trigger provides _ENV, _SERVICE, _REGION, _REPO, _RUNTIME_SA, _LOGS_BUCKET
# (see infra/devops/main.tf). Bash logic lives in scripts/cb-*.sh so this YAML
# stays free of shell variables Cloud Build would try to substitute.
#
# Version resolution:
#   - push on a release branch -> 0.0.0-dev.<short-sha>
#   - push of a tag vMAJOR.MINOR.PATCH -> MAJOR.MINOR.PATCH
#
# Build progress and logs show up as a check on the commit (include_build_logs
# on the trigger: status transitions, start/end times, log output + console link).

logsBucket: '${_LOGS_BUCKET}'

options:
  substitution_option: ALLOW_LOOSE
  logging: GCS_ONLY

steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env:
      - '_ENV=${_ENV}'
      - '_SERVICE=${_SERVICE}'
      - '_REGION=${_REGION}'
      - '_REPO=${_REPO}'
      - 'PROJECT_ID=${PROJECT_ID}'
      - 'SHORT_SHA=${SHORT_SHA}'
      - 'TAG_NAME=${TAG_NAME}'
    args:
      - scripts/cb-build.sh

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    env:
      - '_ENV=${_ENV}'
      - '_SERVICE=${_SERVICE}'
      - '_REGION=${_REGION}'
      - '_REPO=${_REPO}'
      - '_RUNTIME_SA=${_RUNTIME_SA}'
      - 'PROJECT_ID=${PROJECT_ID}'
    args:
      - scripts/cb-deploy.sh
